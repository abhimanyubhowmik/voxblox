world_frame: world
use_tf_transforms: True
use_freespace_pointcloud: True
tsdf_voxels_per_side: 16
tsdf_voxel_size: 0.2
# tsdf_voxel_size: 0.10
max_ray_length_m: 4.0
truncation_distance: 0.5 #1.2
voxel_carving_enabled: True
use_sparsity_compensation_factor: True
sparsity_compensation_factor: 100.0 #10.0
color_mode: "color"
verbose: False
update_mesh_every_n_sec: 0.5
mesh_min_weight: 1e-4
slice_level: 1.0
method: "fast"
integration_order_mode: "sorted"
max_consecutive_ray_collisions: 0
publish_slices: False
publish_pointclouds: True
allow_clear: True
pointcloud_queue_size: 1 #1000
min_time_between_msgs_sec: 0.09
#max_block_distance_from_body: FLT_MAX
publish_tsdf_info: False
publish_slices: False
publish_traversable: False
traversability_radius: 1.0 #0.4 ###1.5
enable_icp: False
icp_refine_roll_pitch: False
accumulate_icp_corrections: True
timestamp_tolerance_sec: 0.001 #0.001
publish_tsdf_map: False
publish_esdf_map: False
tsdf_surface_distance_threshold_factor: 2.0

# ESDF #
esdf_max_distance_m: 3.0
clear_sphere_for_planning: False
clear_sphere_radius: 0.8

# OVERLAP BETWEEN VERSIONS #
use_const_weight: False
use_weight_dropoff: True
use_symmetric_weight_drop_off: False

max_weight: 100 # 200 #20-200
clearing_ray_weight_factor: 0.2 #ANYmal: 0.01 #Flyab: 0.05 #0.05-1.0
weight_ray_by_range: False
min_ray_length_m: 0.5 #1.0
occupancy_min_distance_voxel_size_factor: 1.0
occupancy_distance_voxelsize_factor: 1.0

# Extended probabilistic TSDF integration parameters
lambda_forgetting: 0.95
init_alpha: 1.0
init_beta: 1.0
observed_variance: 0.01
imm_use_confidence_mixing: True
imm_a1_fixed: 0.5
imm_a2_fixed: 0.5
imm_confidence_influence: 0.3

use_pose_uncertainty: true
camera_to_base_translation: [0.0483948, 0.0479978, -0.00977066] # Camera offset in base frame (cam0 AlphaSense in IMU frame)
odometry_topic: "/rovio/odometry"
